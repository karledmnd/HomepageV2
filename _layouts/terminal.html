<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d0d;
    }

    body {
      display: grid;
      place-items: center;
      color: #cccccc;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
    }

    .terminal-window {
      width: 100%;
      max-width: 580px; /* Reduced width for a tighter, snugger fit */
      background-color: #121212;
      border-radius: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      border: 1px solid #282828;
      overflow: hidden;
    }

    .terminal-header {
      background-color: #1a1a1a;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 1px solid #222222;
    }

    .terminal-buttons {
      display: flex;
      gap: 8px;
    }

    .terminal-buttons .btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .btn-close { background-color: #ff5f56; }
    .btn-minimize { background-color: #ffbd2e; }
    .btn-maximize { background-color: #27c93f; }

    .terminal-title {
      color: #777777;
      font-size: 0.82rem;
      text-align: center;
    }

    .terminal-body {
      padding: 24px;
      font-size: 0.95rem;
      min-height: 260px;
    }

    .terminal-input-line {
      display: flex;
      align-items: center;
      padding: 0 24px 24px 24px;
    }

    .terminal-input-line .prompt {
      color: #00d8ff;
      margin-right: 10px;
      white-space: nowrap;
      font-weight: bold;
    }

    #terminal-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      width: 100%;
    }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
